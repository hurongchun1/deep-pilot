[project]
name = "task8"
version = "0.1.0"
description = "青柠清单 v1.2 上线计划 AgentSeek 应用。"
requires-python = ">=3.12,<3.14"
dependencies = [
    "deepagents==0.7.8",
    "langchain-openai>=0.3",
    "python-dotenv>=1.0",
    "agentseek-api[embedded]==0.2.3",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["agent", "tools", "sample_plan", "scripted_model"]

[dependency-groups]
dev = ["pytest==9.1.1"]
