[project]
name = "task8"
version = "0.1.0"
description = "通用任务规划助手：将学习、开发和活动目标拆成行动计划。"
requires-python = ">=3.12,<3.14"
dependencies = [
    "deepagents==0.7.8",
    "langchain-openai>=0.3",
    "python-dotenv>=1.0",
    "agentseek-api[embedded]==0.2.3",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["task8", "task8.experiments"]
package-dir = {"task8" = "."}

[dependency-groups]
dev = ["pytest==9.1.1"]
